<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hey hey</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      text-align: center;
      flex-direction: column;
    }

    .gif {
      width: clamp(100px, 25vw, 150px);
      margin-bottom: -20px; /* pulls GIF slightly above the box */
      z-index: 5;
    }

    .box {
      background: rgba(0, 0, 0, 0.25);
      padding: 5vw;
      border-radius: 16px;
      width: 85vw;
      max-width: 360px;
      min-width: 260px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(22px, 5vw, 28px);
      margin-bottom: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: clamp(14px, 4vw, 18px);
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #noBtn {
      background: #555;
      color: white;
    }

    .heart {
      position: absolute;
      font-size: clamp(18px, 5vw, 28px);
      animation: explode 1.5s ease-out forwards;
      pointer-events: none;
    }

    @keyframes explode {
      from {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      to {
        transform: translate(var(--x), var(--y)) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <img 
    class="gif" 
    src="" 
    alt=""
  >


  <script>
    let scale = 1;

    function no() {
      scale += 0.25;
      document.getElementById("yesBtn").style.transform = `scale(${scale})`;
    }
    }
  </script>

</body>
</html>
